name: Notebook Deterministic Test

run-name: "Test notebook: ${{ inputs.notebook }}"

on:
  workflow_dispatch:
    inputs:
      notebook:
        description: "Path to notebook to test"
        required: true
        type: string

      python-version:
        description: "Python version"
        required: false
        default: "3.11"
        type: string

      requirements:
        description: "Optional requirements file override"
        required: false
        default: ""
        type: string

      timeout:
        description: "Per-cell timeout in seconds"
        required: false
        default: "1200"
        type: string

      compare-stored-outputs:
        description: "Compare fresh execution against committed outputs with nbval"
        required: false
        default: false
        type: boolean


permissions:
  contents: read


jobs:
  notebook-test:
    name: Test ${{ inputs.notebook }}
    runs-on: ubuntu-24.04

    env:
      NOTEBOOK: ${{ inputs.notebook }}
      EXECUTED_DIR: .notebook-ci
      EXECUTED_NOTEBOOK: .notebook-ci/executed.ipynb
      CODE_FILE: .notebook-ci/notebook_code.py

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # Validate requested notebook path
      # ============================================================

      - name: Validate notebook path
        id: notebook-path
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$NOTEBOOK" != *.ipynb ]]; then
            echo "::error::Requested file is not a .ipynb notebook: $NOTEBOOK"
            exit 1
          fi

          if [[ ! -f "$NOTEBOOK" ]]; then
            echo "::error::Notebook does not exist: $NOTEBOOK"
            exit 1
          fi

          echo "Notebook found:"
          echo "  $NOTEBOOK"

          echo "notebook-dir=$(dirname "$NOTEBOOK")" >> "$GITHUB_OUTPUT"


      # ============================================================
      # Python
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}


      # ============================================================
      # Install test tooling
      # ============================================================

      - name: Install notebook test tools
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            nbformat \
            nbclient \
            jupyter \
            nbconvert \
            ipykernel \
            pytest \
            nbval \
            bandit \
            detect-secrets \
            pip-audit \
            flake8 \
            numpy \
            pytz


      # ============================================================
      # Resolve notebook-specific requirements
      # ============================================================

      - name: Resolve notebook requirements
        id: requirements
        shell: bash
        run: |
          set -euo pipefail

          NOTEBOOK_DIR="$(dirname "$NOTEBOOK")"
          OVERRIDE="${{ inputs.requirements }}"

          if [[ -n "$OVERRIDE" ]]; then

            if [[ ! -f "$OVERRIDE" ]]; then
              echo "::error::Requirements override not found: $OVERRIDE"
              exit 1
            fi

            REQUIREMENTS_FILE="$OVERRIDE"

          elif [[ -f "$NOTEBOOK_DIR/requirements.txt" ]]; then

            REQUIREMENTS_FILE="$NOTEBOOK_DIR/requirements.txt"

          else

            REQUIREMENTS_FILE=""

          fi

          if [[ -n "$REQUIREMENTS_FILE" ]]; then
            echo "Using requirements:"
            echo "  $REQUIREMENTS_FILE"
          else
            echo "::warning::No requirements.txt found next to notebook:"
            echo "  $NOTEBOOK_DIR"
          fi

          echo "requirements-file=$REQUIREMENTS_FILE" >> "$GITHUB_OUTPUT"


      # ============================================================
      # Install notebook-specific dependencies
      # ============================================================

      - name: Install notebook dependencies
        id: install-dependencies
        shell: bash
        run: |
          set -euo pipefail

          REQUIREMENTS_FILE="${{ steps.requirements.outputs.requirements-file }}"

          if [[ -n "$REQUIREMENTS_FILE" ]]; then

            echo "Installing notebook dependencies:"
            echo "  $REQUIREMENTS_FILE"

            python -m pip install \
              -r "$REQUIREMENTS_FILE"

          else

            echo "No notebook-local requirements file found."
            echo "Continuing with test environment only."

          fi


      # ============================================================
      # Report environment
      # ============================================================

      - name: Report notebook environment
        shell: bash
        run: |
          python --version
          python -m pip --version

          echo
          echo "Notebook:"
          echo "  $NOTEBOOK"

          echo
          echo "Requirements:"
          echo "  ${{ steps.requirements.outputs.requirements-file }}"

          echo
          echo "Installed packages:"
          python -m pip freeze | sort


      # ============================================================
      # Workspace
      # ============================================================

      - name: Create notebook test workspace
        shell: bash
        run: |
          mkdir -p "$EXECUTED_DIR"


      # ============================================================
      # 1. Notebook schema validation
      # ============================================================

      - name: Validate notebook structure
        id: schema
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import os
          import nbformat

          path = os.environ["NOTEBOOK"]

          with open(path, "r", encoding="utf-8") as f:
              nb = nbformat.read(f, as_version=4)

          nbformat.validate(nb)

          code_cells = [
              cell
              for cell in nb.cells
              if cell.cell_type == "code"
          ]

          print("Notebook schema: PASS")
          print(f"Total cells: {len(nb.cells)}")
          print(f"Code cells: {len(code_cells)}")
          PY


      # ============================================================
      # Extract code for static analysis
      # ============================================================

      - name: Extract notebook code
        id: extract-code
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import os
          import nbformat

          notebook = os.environ["NOTEBOOK"]
          destination = os.environ["CODE_FILE"]

          with open(notebook, encoding="utf-8") as f:
              nb = nbformat.read(f, as_version=4)

          with open(destination, "w", encoding="utf-8") as f:

              for number, cell in enumerate(nb.cells):

                  if cell.cell_type != "code":
                      continue

                  f.write(
                      f"\n\n"
                      f"# ========================================\n"
                      f"# Notebook cell {number}\n"
                      f"# ========================================\n\n"
                  )

                  lines = cell.source.splitlines()
                  in_cell_magic = False

                  for index, line in enumerate(lines):

                      stripped = line.lstrip()

                      if index == 0 and stripped.startswith("%%"):
                          in_cell_magic = True
                          f.write("# JUPYTER CELL MAGIC: " + line + "\n")
                          continue

                      if in_cell_magic:
                          f.write("# MAGIC CONTENT: " + line + "\n")
                          continue

                      if stripped.startswith("%"):
                          f.write("# JUPYTER MAGIC: " + line + "\n")

                      elif stripped.startswith("!"):
                          f.write("# SHELL COMMAND: " + line + "\n")

                      else:
                          f.write(line + "\n")

          print(f"Extracted notebook code to {destination}")
          PY


      # ============================================================
      # 2. Secret scanning
      # ============================================================

      - name: Scan notebook for secrets
        id: secrets
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          detect-secrets scan \
            "$CODE_FILE" \
            > "$EXECUTED_DIR/secrets.json"

          python <<'PY'
          import json
          import os

          path = os.path.join(
              os.environ["EXECUTED_DIR"],
              "secrets.json",
          )

          with open(path) as f:
              result = json.load(f)

          findings = result.get("results", {})

          if findings:

              print("Potential secrets detected:")

              for filename, matches in findings.items():
                  for match in matches:
                      print(
                          f"{filename}:"
                          f"{match.get('line_number')} "
                          f"{match.get('type')}"
                      )

              raise SystemExit(
                  "Potential secrets detected."
              )

          print("Secret scan: PASS")
          PY


      # ============================================================
      # 3. Bandit
      # ============================================================

      - name: Run Bandit security scan
        id: bandit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          bandit \
            --severity-level medium \
            --confidence-level medium \
            "$CODE_FILE" \
            | tee "$EXECUTED_DIR/bandit.txt"


      # ============================================================
      # 4. Dependency audit
      # ============================================================

      - name: Audit notebook dependencies
        id: pip-audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          REQUIREMENTS_FILE="${{ steps.requirements.outputs.requirements-file }}"

          if [[ -n "$REQUIREMENTS_FILE" ]]; then

            echo "Auditing:"
            echo "  $REQUIREMENTS_FILE"

            pip-audit \
              -r "$REQUIREMENTS_FILE" \
              | tee "$EXECUTED_DIR/pip-audit.txt"

          else

            echo "No notebook requirements file found." \
              | tee "$EXECUTED_DIR/pip-audit.txt"

            echo "Dependency audit skipped." \
              | tee -a "$EXECUTED_DIR/pip-audit.txt"

          fi


      # ============================================================
      # 5. PEP8
      # ============================================================

      - name: Checkout notebook CI helpers
        uses: actions/checkout@v7
        with:
          repository: spacetelescope/notebook-ci-actions
          ref: main
          path: .notebook-ci-actions
          sparse-checkout: .github/helpers


      - name: Run notebook PEP8 check
        id: pep8
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          python \
            .notebook-ci-actions/.github/helpers/pep8_nb_style_checker.py \
            "$NOTEBOOK" \
            | tee "$EXECUTED_DIR/pep8.txt"


      # ============================================================
      # 6. Broken-link checking
      # ============================================================

      - name: Convert notebook to markdown for link checking
        id: markdown-export
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$EXECUTED_DIR/link-check"

          jupyter nbconvert \
            --to markdown \
            --output-dir "$EXECUTED_DIR/link-check" \
            "$NOTEBOOK"


      - name: Check notebook links
        id: links
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --scheme http
            --scheme https
            --method get
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36"
            --header "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
            --max-concurrency 16
            --host-concurrency 2
            --host-request-interval 500ms
            --max-retries 3
            --accept "100..=103,200..=299,403,405"
            .notebook-ci/link-check/**/*.md
          fail: true
          jobSummary: false


      # ============================================================
      # 7. Accessibility
      # ============================================================

      - name: Run notebook accessibility check
        id: a11y
        continue-on-error: true
        shell: bash
        run: |
          set +e

          npx --yes \
            @jupyterlab-a11y-checker/cli \
            --json \
            "$NOTEBOOK" \
            > "$EXECUTED_DIR/a11y-raw.log" \
            2>&1

          EXIT_CODE=$?

          set -e

          sed -n '/^{/,$p' \
            "$EXECUTED_DIR/a11y-raw.log" \
            > "$EXECUTED_DIR/a11y.json"

          if jq -e \
            '.summary.totalIssues | numbers' \
            "$EXECUTED_DIR/a11y.json" \
            >/dev/null 2>&1
          then

            ISSUE_COUNT=$(
              jq -r \
                '.summary.totalIssues' \
                "$EXECUTED_DIR/a11y.json"
            )

            echo "Accessibility findings: $ISSUE_COUNT"

          else

            echo "::warning::Accessibility checker did not return expected JSON."
            cat "$EXECUTED_DIR/a11y-raw.log"

          fi

          # Accessibility remains advisory.
          exit 0


      # ============================================================
      # 8. Execute notebook
      # ============================================================

      - name: Execute notebook
        id: execute
        shell: bash
        env:
          CELL_TIMEOUT: ${{ inputs.timeout }}
        run: |
          set -euo pipefail

          python <<'PY'
          import os
          import shutil
          import sys
          import traceback

          import nbformat
          from nbclient import NotebookClient

          source = os.environ["NOTEBOOK"]
          destination = os.environ["EXECUTED_NOTEBOOK"]
          timeout = int(os.environ["CELL_TIMEOUT"])

          os.makedirs(
              os.path.dirname(destination),
              exist_ok=True,
          )

          shutil.copy2(
              source,
              destination,
          )

          with open(
              destination,
              "r",
              encoding="utf-8",
          ) as f:

              nb = nbformat.read(
                  f,
                  as_version=4,
              )

          kernel = (
              nb.metadata
              .get("kernelspec", {})
              .get("name", "python3")
          )

          notebook_directory = (
              os.path.dirname(
                  os.path.abspath(source)
              )
              or "."
          )

          print(f"Notebook: {source}")
          print(f"Working directory: {notebook_directory}")
          print(f"Kernel: {kernel}")
          print(f"Cell timeout: {timeout}s")

          client = NotebookClient(
              nb,
              timeout=timeout,
              kernel_name=kernel,
              allow_errors=False,
              record_timing=True,
          )

          failure = None

          try:

              client.execute(
                  cwd=notebook_directory
              )

          except Exception as exc:

              failure = exc

              print("\nNOTEBOOK EXECUTION FAILED")
              traceback.print_exc()

          finally:

              with open(
                  destination,
                  "w",
                  encoding="utf-8",
              ) as f:

                  nbformat.write(
                      nb,
                      f,
                  )

              print(
                  "\nExecuted notebook saved to:"
              )
              print(
                  f"  {destination}"
              )

          if failure:
              sys.exit(1)

          print("\nNotebook execution: PASS")
          PY


      # ============================================================
      # 9. Validate executed notebook
      # ============================================================

      - name: Validate executed notebook
        id: executed-validation
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$EXECUTED_NOTEBOOK" ]]; then

            echo "::notice::No executed notebook was produced."
            exit 0

          fi

          python <<'PY'
          import os
          import nbformat

          path = os.environ["EXECUTED_NOTEBOOK"]

          with open(
              path,
              encoding="utf-8",
          ) as f:

              nb = nbformat.read(
                  f,
                  as_version=4,
              )

          nbformat.validate(nb)

          errors = []
          executable = 0
          executed = 0

          for index, cell in enumerate(nb.cells):

              if cell.cell_type != "code":
                  continue

              if not cell.source.strip():
                  continue

              executable += 1

              if cell.execution_count is not None:
                  executed += 1

              for output in cell.get(
                  "outputs",
                  [],
              ):

                  if (
                      output.get("output_type")
                      == "error"
                  ):

                      errors.append(
                          (
                              index,
                              output.get("ename"),
                              output.get("evalue"),
                          )
                      )

          print(
              f"Executable code cells: {executable}"
          )

          print(
              f"Executed code cells:   {executed}"
          )

          if errors:

              print("\nERROR OUTPUTS FOUND:")

              for cell, name, value in errors:
                  print(
                      f"Cell {cell}: "
                      f"{name}: {value}"
                  )

              raise SystemExit(
                  "Executed notebook contains error outputs."
              )

          print("Executed notebook schema: PASS")
          print("Error output check: PASS")
          PY


      # ============================================================
      # 10. Optional nbval comparison
      # ============================================================

      - name: Compare against committed outputs
        id: nbval
        if: ${{ inputs.compare-stored-outputs }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          pytest \
            --nbval \
            "$NOTEBOOK" \
            | tee "$EXECUTED_DIR/nbval.txt"


      # ============================================================
      # Upload artifacts
      # ============================================================

      - name: Upload notebook test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notebook-test-${{ github.run_id }}
          path: |
            .notebook-ci/
          if-no-files-found: warn
          retention-days: 14


      # ============================================================
      # Summary
      # ============================================================

      - name: Generate notebook test summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Notebook Deterministic Test"
            echo
            echo "**Notebook:** \`$NOTEBOOK\`"
            echo
            echo "**Requirements:** \`${{ steps.requirements.outputs.requirements-file }}\`"
            echo
            echo "**Python:** \`${{ inputs.python-version }}\`"
            echo

            echo "## Core"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Notebook structure | ${{ steps.schema.outcome }} |"
            echo "| Notebook execution | ${{ steps.execute.outcome }} |"
            echo "| Executed notebook validation | ${{ steps.executed-validation.outcome }} |"

            if [[ "${{ inputs.compare-stored-outputs }}" == "true" ]]; then
              echo "| Stored-output comparison | ${{ steps.nbval.outcome }} |"
            else
              echo "| Stored-output comparison | skipped |"
            fi

            echo
            echo "## Quality"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| PEP8 | ${{ steps.pep8.outcome }} |"
            echo "| Broken links | ${{ steps.links.outcome }} |"
            echo "| Accessibility | ${{ steps.a11y.outcome }} |"

            echo
            echo "## Security"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Secret scan | ${{ steps.secrets.outcome }} |"
            echo "| Bandit | ${{ steps.bandit.outcome }} |"
            echo "| Dependency audit | ${{ steps.pip-audit.outcome }} |"

            echo
            echo "Executed notebook and diagnostic reports are available in the workflow artifact."

          } >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # Final required pass/fail
      # ============================================================

      - name: Determine final test result
        if: always()
        shell: bash
        run: |
          FAILED=0

          echo "Required checks:"
          echo

          if [[ "${{ steps.schema.outcome }}" != "success" ]]; then
            echo "❌ Notebook structure validation failed"
            FAILED=1
          else
            echo "✅ Notebook structure validation passed"
          fi

          if [[ "${{ steps.execute.outcome }}" != "success" ]]; then
            echo "❌ Notebook execution failed"
            FAILED=1
          else
            echo "✅ Notebook execution passed"
          fi

          if [[ "${{ steps.executed-validation.outcome }}" != "success" ]]; then
            echo "❌ Executed notebook validation failed"
            FAILED=1
          else
            echo "✅ Executed notebook validation passed"
          fi

          if [[ "${{ inputs.compare-stored-outputs }}" == "true" ]]; then

            if [[ "${{ steps.nbval.outcome }}" != "success" ]]; then
              echo "❌ Stored-output comparison failed"
              FAILED=1
            else
              echo "✅ Stored-output comparison passed"
            fi

          fi

          echo
          echo "Quality checks:"
          echo "PEP8:          ${{ steps.pep8.outcome }}"
          echo "Links:         ${{ steps.links.outcome }}"
          echo "Accessibility: ${{ steps.a11y.outcome }}"

          echo
          echo "Security checks:"
          echo "Secrets:       ${{ steps.secrets.outcome }}"
          echo "Bandit:        ${{ steps.bandit.outcome }}"
          echo "Dependencies:  ${{ steps.pip-audit.outcome }}"

          echo

          if [[ "$FAILED" -ne 0 ]]; then
            echo "::error::One or more required notebook tests failed."
            exit 1
          fi

          echo "All required notebook tests passed."
